{% load static %}
{% with section=request.resolver_match.app_name page=request.resolver_match.url_name %}
<header class="site-header">
    <div class="site-header-inner">
        <a class="site-brand" href="{% url 'homepage:index' %}">
            <img src="{% static 'homepage/img/logo.svg' %}" alt="" class="site-logo">
            Учёт материалов
        </a>
        <nav class="site-nav" aria-label="Разделы">
            <a
                href="{% url 'materials:list' %}"
                {% if section == "materials" %}aria-current="page"{% endif %}
            >Материалы</a>
            <a
                href="{% url 'warehouses:list' %}"
                {% if section == "warehouses" %}aria-current="page"{% endif %}
            >Склады</a>
            <a
                href="{% url 'operations:list' %}"
                {% if section == "operations" and page != "statistics" %}aria-current="page"{% endif %}
            >Операции</a>
            <a
                href="{% url 'operations:statistics' %}"
                {% if page == "statistics" %}aria-current="page"{% endif %}
            >Статистика</a>
        </nav>
    </div>
</header>
{% endwith %}
