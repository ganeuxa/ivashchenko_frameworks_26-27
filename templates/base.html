{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Учёт материалов{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    {% include "includes/navigation.html" %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        Учёт расходных материалов, <span id="current-year"></span>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
