<li class="ledger-row ledger-row-simple">
    <a class="ledger-name" href="{% url 'warehouses:detail' row.id %}">
        {{ row.name }}
        <span class="ledger-sub">
            {{ row.location|default:"адрес не указан" }}
        </span>
    </a>
    <div class="ledger-amount">
        <strong class="num">{{ row.positions }}</strong>
        <span class="ledger-sub">видов материалов</span>
    </div>
</li>
