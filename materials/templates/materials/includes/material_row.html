<li class="ledger-row level-{{ row.level }}">
    <a class="ledger-name" href="{% url 'materials:detail' row.material.id %}">
        {{ row.material.name|default:"Без названия" }}
        <span class="ledger-sub">
            минимум {{ row.material.min_balance }} {{ row.material.unit }}
        </span>
    </a>
    {% include "includes/stock_gauge.html" %}
    <div class="ledger-amount">
        <strong class="num">{{ row.total }}</strong> {{ row.material.unit }}
        <div>{% include "includes/stock_badge.html" with level=row.level %}</div>
    </div>
</li>
